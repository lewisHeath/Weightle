# Deploy via Google Cloud Build (connect GitHub in GCP console).
# See docs/GCP-CLOUD-BUILD-DEPLOY.md

steps:
  - name: node:22
    entrypoint: npm
    args: ["ci"]

  - name: node:22
    entrypoint: npm
    args: ["run", "validate-dataset"]

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --progress=plain
      - --build-arg
      - NEXT_PUBLIC_ADSENSE_CLIENT_ID=${_ADSENSE_CLIENT_ID}
      - --build-arg
      - NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR_LEFT=${_ADSENSE_SLOT_LEFT}
      - --build-arg
      - NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR_RIGHT=${_ADSENSE_SLOT_RIGHT}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - weightle
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --update-env-vars=NEXT_PUBLIC_SITE_URL=https://weightle.app,NEXT_PUBLIC_IMAGE_BASE_URL=https://cdn.weightle.app

substitutions:
  _REGION: europe-west2
  _AR_REPO: weightle
  _IMAGE_NAME: app
  _ADSENSE_CLIENT_ID: ca-pub-4645143064426091
  _ADSENSE_SLOT_LEFT: "4179362274"
  _ADSENSE_SLOT_RIGHT: "8406759196"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
